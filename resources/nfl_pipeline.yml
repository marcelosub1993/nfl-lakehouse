resources:
  pipelines:
    nfl_pipeline:
      name: nfl_pipeline
      catalog: ${var.catalog}
      schema: ${resources.schemas.bronze.name}
      serverless: true
      continuous: false
      channel: CURRENT
      tags:
        project: nfl
      
      configuration:
        landing_path: ${resources.volumes.espn_raw.volume_path}
        silver_schema: ${resources.schemas.silver.name}

      libraries:
        - glob:
            include: ../src/pipelines/**