# This is a Declarative Automation Bundle definition for nfl-lakehouse.
# The Databricks extension requires databricks.yml configuration file.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.

bundle:
  name: nfl-lakehouse

include:
  - resources/*.yml

sync:
  exclude:
    - setup/
    - README.md

variables:
  catalog:
    description: Name of the catalog

targets:
  dev:
    variables:
      catalog: nfl_dev
    mode: development
    default: true
    workspace:
      host: https://adb-7405619760102827.7.azuredatabricks.net

  # Optionally, there could be 'staging' or 'prod' targets here.
  
  prod:
    variables:
      catalog: nfl_prod
    mode: production
    workspace:
      host: https://adb-7405619760102827.7.azuredatabricks.net
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}