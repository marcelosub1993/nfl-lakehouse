# This is a Declarative Automation Bundle definition for nfl-lakehouse.
# The Databricks extension requires databricks.yml configuration file.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.

bundle:
  name: nfl-lakehouse

include:
  - resources/*.yml

sync:
  exclude:
    - setup/
    - README.md
    - tests/
    - pyproject.toml

variables:
  catalog:
    description: Name of the catalog
  prod_deployer:
    description: Application ID of the service principal that deploys and runs prod
    default: cd781d7f-7da7-43f1-929c-ce45c09a84bb

targets:
  dev:
    variables:
      catalog: nfl_dev
    mode: development
    default: true
    workspace:
      host: https://adb-7405619760102827.7.azuredatabricks.net

  prod:
    variables:
      catalog: nfl_prod
    mode: production
    workspace:
      host: https://adb-7405619760102827.7.azuredatabricks.net
      root_path: /Workspace/Users/${var.prod_deployer}/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${var.prod_deployer}
    resources:
      schemas:
        gold:
          grants: 
            - principal: nfl-readers
              privileges:
                - USE_SCHEMA
                - SELECT