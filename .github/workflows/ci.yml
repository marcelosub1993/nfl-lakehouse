name: CI

on: 
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency: 
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Java 21 (Spark runs on the JVM)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      
      - name: Run unit tests
        run: python -m pytest -v
  
  bundle-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ci
    permissions:
      contents: read
      id-token: write
    env:
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      DATABRICKS_TOKEN_AUDIENCE: ${{ vars.DATABRICKS_TOKEN_AUDIENCE }}

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Install the Databricks CLI
        uses: databricks/setup-cli@v1.26.0
      
      - name: Check who CI is logged in as
        run: databricks current-user me

      - name: Validate the dev target
        run: databricks bundle validate --strict -t dev
      
      - name: Validate the prod target
        run: databricks bundle validate --strict -t prod